<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group include-disable">
      <label>
        <input type="checkbox" [checked]="includeDisabled()" (change)="toggleIncludeDisabled($any($event.target).checked)" />
        Include Disable
      </label>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
      <p-button [label]="addLabel" icon="pi pi-plus" [routerLink]="['/masters', masterType, 'add']"></p-button>
    </div>
  </div>

  <p-table [value]="filteredRows()" [rows]="50" [paginator]="true" [rowsPerPageOptions]="[10, 25, 50]" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Action</th>
        <th *ngFor="let col of columns" class="sortable-th" (click)="toggleSort(col.key)">
          {{ col.label }}
          <span class="sort-icons"><i class="pi" [class.pi-sort-amount-up-alt]="sortField() === col.key && sortAsc()" [class.pi-sort-amount-down]="sortField() === col.key && !sortAsc()" [class.pi-sort-alt]="sortField() !== col.key"></i></span>
        </th>
        <th class="sortable-th" (click)="toggleSort('active')">
          Active
          <span class="sort-icons"><i class="pi" [class.pi-sort-amount-up-alt]="sortField() === 'active' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'active' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'active'"></i></span>
        </th>
      </tr>
      <tr class="column-filter-row">
        <th></th>
        <th *ngFor="let col of columns">
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" [attr.aria-label]="'Filter by ' + col.label" [ngModel]="columnFilters()[col.key]" (ngModelChange)="setColumnFilter(col.key, $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
        <th>
          <select class="column-filter-select" aria-label="Filter by Active" [ngModel]="activeFilterValue()" (ngModelChange)="setActiveFilter($event)">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a class="row-action" title="Edit" [routerLink]="['/masters', masterType, indexOf(row), 'edit']"><i class="pi pi-pencil"></i></a>
          <button
            class="row-action"
            [class.is-disable]="row['active']"
            [class.is-enable]="!row['active']"
            [title]="row['active'] ? 'Disable' : 'Enable'"
            (click)="toggleActive(row)"
          >
            <i class="pi" [class.pi-power-off]="row['active']" [class.pi-refresh]="!row['active']"></i>
          </button>
          <a class="row-action" title="View" [routerLink]="['/masters', masterType, indexOf(row), 'view']"><i class="pi pi-eye"></i></a>
          <a class="row-action" title="History" [routerLink]="['/masters', masterType, indexOf(row), 'history']"><i class="pi pi-history"></i></a>
        </td>
        <td *ngFor="let col of columns">{{ row[col.key] }}</td>
        <td>
          <p-tag [value]="row['active'] ? 'Yes' : 'No'" [severity]="row['active'] ? 'success' : 'secondary'"></p-tag>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.length + 2" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No records match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
