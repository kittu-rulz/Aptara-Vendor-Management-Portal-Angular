<section class="dashboard-hero">
  <div class="hero-copy">
    <div>
      <span class="hero-eyebrow">VENDOR OPERATIONS</span>
      <h2>Good morning, Abhijit</h2>
      <p>Here's the latest view of your outsource portfolio.</p>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card" *ngFor="let kpi of kpis()" [class]="'kpi-' + kpi.accent">
      <div class="kpi-top-row">
        <div class="kpi-icon"><i [class]="kpi.icon"></i></div>
      </div>
      <div class="kpi-content">
        <span class="kpi-label">{{ kpi.label }}</span>
        <span class="kpi-value">{{ kpi.value }}</span>
        <span class="kpi-trend">{{ kpi.trend }}</span>
      </div>
    </div>
  </div>
</section>

<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group include-disable">
      <label>
        <input type="checkbox" [checked]="includeDisabled()" (change)="toggleIncludeDisabled($any($event.target).checked)" />
        Include Disable
      </label>
    </div>
    <div class="toolbar-actions">
      <p-button label="Export to Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
      <p-button label="Outsource Request" icon="pi pi-plus" routerLink="/outsource-requests/add"></p-button>
    </div>
  </div>

  <p-table [value]="filteredRequests()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Award</th>
        <th class="sortable-th" (click)="toggleSort('id')">
          RevSys ID
          <span class="sort-icons">
            <i class="pi pi-sort-alt" [class.pi-sort-amount-up-alt]="sortField() === 'id' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'id' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'id'"></i>
          </span>
        </th>
        <th class="sortable-th" (click)="toggleSort('client')">
          Client Name
          <span class="sort-icons">
            <i [class.pi-sort-amount-up-alt]="sortField() === 'client' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'client' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'client'" class="pi"></i>
          </span>
        </th>
        <th class="sortable-th" (click)="toggleSort('project')">
          Project Name
          <span class="sort-icons">
            <i [class.pi-sort-amount-up-alt]="sortField() === 'project' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'project' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'project'" class="pi"></i>
          </span>
        </th>
        <th class="sortable-th" (click)="toggleSort('status')">
          Status
          <span class="sort-icons">
            <i [class.pi-sort-amount-up-alt]="sortField() === 'status' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'status' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'status'" class="pi"></i>
          </span>
        </th>
        <th class="sortable-th" (click)="toggleSort('vendor')">
          Vendor Name
          <span class="sort-icons">
            <i [class.pi-sort-amount-up-alt]="sortField() === 'vendor' && sortAsc()" [class.pi-sort-amount-down]="sortField() === 'vendor' && !sortAsc()" [class.pi-sort-alt]="sortField() !== 'vendor'" class="pi"></i>
          </span>
        </th>
      </tr>
      <tr class="column-filter-row">
        <th></th>
        <th></th>
        <th>
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" aria-label="Filter by RevSys ID" [ngModel]="columnFilters().id" (ngModelChange)="setColumnFilter('id', $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
        <th>
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" aria-label="Filter by Client Name" [ngModel]="columnFilters().client" (ngModelChange)="setColumnFilter('client', $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
        <th>
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" aria-label="Filter by Project Name" [ngModel]="columnFilters().project" (ngModelChange)="setColumnFilter('project', $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
        <th>
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" aria-label="Filter by Status" [ngModel]="columnFilters().status" (ngModelChange)="setColumnFilter('status', $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
        <th>
          <span class="column-filter-input-wrap">
            <input type="text" class="column-filter-input" aria-label="Filter by Vendor Name" [ngModel]="columnFilters().vendor" (ngModelChange)="setColumnFilter('vendor', $event)" />
            <i class="pi pi-filter column-filter-icon"></i>
          </span>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <button
            class="row-action"
            [class.is-disable]="row.active"
            [class.is-enable]="!row.active"
            [title]="row.active ? 'Disable' : 'Enable'"
            (click)="toggleActive(row)"
          >
            <i class="pi" [class.pi-trash]="row.active" [class.pi-refresh]="!row.active"></i>
          </button>
          <a class="row-action" title="View" [routerLink]="['/outsource-requests', indexOf(row), 'view']"><i class="pi pi-eye"></i></a>
          <a class="row-action" title="History" [routerLink]="['/outsource-requests', indexOf(row), 'history']"><i class="pi pi-history"></i></a>
        </td>
        <td>
          <a *ngIf="row.awarded" class="row-action award-trophy" title="Outsourcing Complete" [routerLink]="['/outsource-requests', indexOf(row), 'complete']">
            <i class="pi pi-trophy"></i>
          </a>
        </td>
        <td class="mono">{{ row.id }}</td>
        <td>{{ row.client }}</td>
        <td><strong>{{ row.project }}</strong></td>
        <td>
          <p-tag
            [value]="displayStatus(row.status)"
            [severity]="statusSeverity(row.status).severity"
            [styleClass]="statusSeverity(row.status).styleClass || ''"
          ></p-tag>
        </td>
        <td><strong>{{ row.vendor }}</strong></td>
      </tr>
    </ng-template>
  </p-table>
</div>
