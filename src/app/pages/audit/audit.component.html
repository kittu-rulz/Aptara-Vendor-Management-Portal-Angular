<div class="table-card">
  <div class="table-toolbar">
    <span class="section-heading"><i class="pi pi-history"></i> System Audit Log</span>
  </div>

  <p-table [value]="entries" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Attribute</th>
        <th>Old Value</th>
        <th>New Value</th>
        <th>Changed By</th>
        <th>Timestamp</th>
        <th>Comments</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><strong>{{ row.attr }}</strong></td>
        <td>{{ row.oldVal || '—' }}</td>
        <td><p-tag [value]="row.newVal" severity="info"></p-tag></td>
        <td>{{ row.user }}</td>
        <td>{{ row.date }}</td>
        <td>{{ row.comment }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
