<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group include-disable">
      <label>
        <input type="checkbox" [checked]="includeDisabled()" (change)="toggleIncludeDisabled($any($event.target).checked)" />
        Include Disable
      </label>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
    </div>
  </div>

  <p-table [value]="filteredInvoices()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Project Name</th>
        <th>Status</th>
        <th>OutSourcing Amount</th>
        <th>Invoiced Till Date</th>
        <th>Project Start Date</th>
        <th>Project End Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a class="row-action" title="New Invoice Submission" [routerLink]="['/invoice-details', indexOf(row), 'submit']"><i class="pi pi-plus"></i></a>
          <button
            class="row-action"
            [class.is-disable]="row.active"
            [class.is-enable]="!row.active"
            [title]="row.active ? 'Disable' : 'Enable'"
            (click)="toggleActive(row)"
          >
            <i class="pi" [class.pi-trash]="row.active" [class.pi-refresh]="!row.active"></i>
          </button>
          <a class="row-action" title="View" [routerLink]="['/invoice-details', indexOf(row), 'view']"><i class="pi pi-eye"></i></a>
          <a class="row-action" title="History" [routerLink]="['/invoice-details', indexOf(row), 'history']"><i class="pi pi-history"></i></a>
          <a *ngIf="row.hasSubmission" class="row-action" title="Approve" [routerLink]="['/invoice-details', indexOf(row), 'submit']"><i class="pi pi-check-circle"></i></a>
        </td>
        <td><strong>{{ row.project }}</strong></td>
        <td>
          <p-tag
            *ngIf="row.status"
            [value]="row.status"
            [severity]="statusSeverity(row.status).severity"
            [styleClass]="statusSeverity(row.status).styleClass || ''"
          ></p-tag>
        </td>
        <td class="amount">{{ row.total }}</td>
        <td class="amount">{{ row.invoiced }}</td>
        <td>{{ row.start }}</td>
        <td>{{ row.end }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No invoices match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
