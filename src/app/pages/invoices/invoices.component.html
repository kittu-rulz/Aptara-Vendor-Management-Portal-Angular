<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group">
      <button class="filter-chip" [class.active]="activeFilter() === 'all'" (click)="setFilter('all')">
        All Invoices ({{ allInvoices.length }})
      </button>
      <button class="filter-chip" [class.active]="activeFilter() === 'Paid & Closed'" (click)="setFilter('Paid & Closed')">
        Paid &amp; Closed
      </button>
      <button class="filter-chip" [class.active]="activeFilter() === 'Pending PM Approval'" (click)="setFilter('Pending PM Approval')">
        Pending Approval
      </button>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true"></p-button>
    </div>
  </div>

  <p-table [value]="filteredInvoices()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Project Name</th>
        <th>Status</th>
        <th>OutSourcing Amount</th>
        <th>Invoiced Till Date</th>
        <th>Project Start Date</th>
        <th>Project End Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
      <tr>
        <td>
          <button class="row-action" title="Submit Invoice"><i class="pi pi-send"></i></button>
          <button class="row-action" title="View Details"><i class="pi pi-eye"></i></button>
          <button class="row-action" title="View History"><i class="pi pi-history"></i></button>
          <button *ngIf="rowIndex < 3" class="row-action" title="Approve/Reject"><i class="pi pi-check-circle"></i></button>
        </td>
        <td><strong>{{ row.project }}</strong></td>
        <td>
          <p-tag
            [value]="row.status"
            [severity]="statusSeverity(row.status).severity"
            [styleClass]="statusSeverity(row.status).styleClass || ''"
          ></p-tag>
        </td>
        <td class="amount">{{ row.total }}</td>
        <td class="amount">{{ row.invoiced }}</td>
        <td>{{ row.start }}</td>
        <td>{{ row.end }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No invoices match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
