<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group">
      <button class="filter-chip active">All System Keys ({{ rows().length }})</button>
    </div>
    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
    </div>
  </div>

  <p-table [value]="rows()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Key Name</th>
        <th>Setting Value</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <ng-container *ngIf="!isEditing(row)">
            <button class="row-action" title="Edit" (click)="startEdit(row)"><i class="pi pi-pencil"></i></button>
          </ng-container>
          <ng-container *ngIf="isEditing(row)">
            <button class="row-action is-enable" title="Confirm" (click)="confirmEdit(row)"><i class="pi pi-check"></i></button>
            <button class="row-action is-disable" title="Cancel" (click)="cancelEdit()"><i class="pi pi-times"></i></button>
          </ng-container>
        </td>
        <td><strong>{{ row.key }}</strong></td>
        <td>
          <p-dropdown
            *ngIf="isEditing(row)"
            [options]="boolOptions"
            [(ngModel)]="draftValue"
            styleClass="w-full"
          ></p-dropdown>
          <ng-container *ngIf="!isEditing(row)">{{ row.val }}</ng-container>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
