<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group">
      <button class="filter-chip active">All System Keys ({{ rows.length }})</button>
    </div>
    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true"></p-button>
    </div>
  </div>

  <p-table [value]="rows" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Key Name</th>
        <th>Setting Value</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><button class="row-action" title="Edit"><i class="pi pi-pencil"></i></button></td>
        <td><strong>{{ row.key }}</strong></td>
        <td>{{ row.val }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
