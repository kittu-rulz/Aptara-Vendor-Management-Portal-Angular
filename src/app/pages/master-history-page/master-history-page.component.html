<div class="table-card">
  <div class="table-toolbar">
    <span class="section-heading"><i class="pi pi-history"></i> {{ title }}</span>
    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
      <p-button label="Back" icon="pi pi-arrow-left" severity="danger" (click)="back()"></p-button>
    </div>
  </div>

  <p-table [value]="entries" [rows]="50" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Attribute</th>
        <th>Old Value</th>
        <th>New Value</th>
        <th>Changed By</th>
        <th>Changed On</th>
        <th>Comment</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td><strong>{{ row.attr }}</strong></td>
        <td>{{ row.oldVal || '—' }}</td>
        <td>{{ row.newVal }}</td>
        <td>{{ row.user }}</td>
        <td>{{ row.date }}</td>
        <td>{{ row.comment }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty-state">
          <i class="pi pi-inbox"></i>
          <div>No records found</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
