<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group include-disable">
      <label>
        <input type="checkbox" [checked]="includeDisabled()" (change)="toggleIncludeDisabled($any($event.target).checked)" />
        Include Disable
      </label>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true" (click)="exportExcel()"></p-button>
      <p-button label="User" icon="pi pi-plus" routerLink="/manage-users/add"></p-button>
    </div>
  </div>

  <p-table [value]="filteredUsers()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Action</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>User Type</th>
        <th>Vendor</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a class="row-action" title="Edit" [routerLink]="['/manage-users', indexOf(row), 'edit']"><i class="pi pi-pencil"></i></a>
          <button
            class="row-action"
            [class.is-disable]="row.status === 'Active'"
            [class.is-enable]="row.status !== 'Active'"
            [title]="row.status === 'Active' ? 'Disable' : 'Enable'"
            (click)="toggleStatus(row)"
          >
            <i class="pi" [class.pi-power-off]="row.status === 'Active'" [class.pi-refresh]="row.status !== 'Active'"></i>
          </button>
          <a class="row-action" title="View" [routerLink]="['/manage-users', indexOf(row), 'view']"><i class="pi pi-eye"></i></a>
          <a class="row-action" title="History" [routerLink]="['/manage-users', indexOf(row), 'history']"><i class="pi pi-history"></i></a>
        </td>
        <td><strong>{{ row.first }}</strong></td>
        <td>{{ row.last }}</td>
        <td>{{ row.email }}</td>
        <td>{{ row.phone }}</td>
        <td><p-tag [value]="row.role" severity="info"></p-tag></td>
        <td>{{ row.vendor || '—' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No users match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
