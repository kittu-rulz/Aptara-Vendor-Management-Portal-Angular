<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group include-disable">
      <label>
        <input type="checkbox" [checked]="includeRejected()" (change)="toggleIncludeRejected($any($event.target).checked)" />
        Include Rejected
      </label>
      <label>
        <input type="checkbox" [checked]="includeDisabled()" (change)="toggleIncludeDisabled($any($event.target).checked)" />
        Include Disable
      </label>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export to Excel" icon="pi pi-file-excel" severity="success" (click)="exportExcel()"></p-button>
      <p-button label="Vendor" icon="pi pi-plus" severity="success" routerLink="/manage-vendors/add"></p-button>
      <p-button label="Generate Registration Link" icon="pi pi-link" severity="success" (click)="sendRegistrationLink()"></p-button>
    </div>
  </div>

  <p-table [value]="filteredVendors()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Name of the Company</th>
        <th>City</th>
        <th>Key Contact Person - Name</th>
        <th>Key Contact Person - Email ID</th>
        <th>Nature of Service</th>
        <th>Type of Organization</th>
        <th>Vendor Status</th>
        <th>Record Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <a class="row-action" title="Edit" [routerLink]="['/manage-vendors', indexOf(row), 'edit']"><i class="pi pi-pencil"></i></a>
          <button
            class="row-action"
            [class.is-disable]="row.status === 'Active'"
            [class.is-enable]="row.status !== 'Active'"
            [title]="row.status === 'Active' ? 'Disable' : 'Enable'"
            (click)="toggleStatus(row)"
          >
            <i class="pi" [class.pi-power-off]="row.status === 'Active'" [class.pi-refresh]="row.status !== 'Active'"></i>
          </button>
          <a class="row-action" title="View" [routerLink]="['/manage-vendors', indexOf(row), 'view']"><i class="pi pi-eye"></i></a>
          <a class="row-action" title="History" [routerLink]="['/manage-vendors', indexOf(row), 'history']"><i class="pi pi-history"></i></a>
        </td>
        <td><strong>{{ row.name }}</strong></td>
        <td>{{ row.city }}</td>
        <td>{{ row.contact }}</td>
        <td>{{ row.email }}</td>
        <td>{{ row.services }}</td>
        <td>{{ row.organization }}</td>
        <td>
          <p-tag
            [value]="row.vendorStatus"
            [severity]="statusSeverity(row.vendorStatus).severity"
            [styleClass]="statusSeverity(row.vendorStatus).styleClass || ''"
          ></p-tag>
        </td>
        <td>
          <p-tag
            [value]="row.status"
            [severity]="statusSeverity(row.status).severity"
            [styleClass]="statusSeverity(row.status).styleClass || ''"
          ></p-tag>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="9" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No vendors match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
