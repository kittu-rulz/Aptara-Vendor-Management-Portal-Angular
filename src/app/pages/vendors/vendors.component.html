<div class="table-card">
  <div class="table-toolbar">
    <div class="filter-group">
      <button
        class="filter-chip"
        [class.active]="activeFilter() === 'all'"
        (click)="setFilter('all')"
      >
        All Vendors ({{ allVendors.length }})
      </button>
      <button
        class="filter-chip"
        [class.active]="activeFilter() === 'Active'"
        (click)="setFilter('Active')"
      >
        Active
      </button>
      <button
        class="filter-chip"
        [class.active]="activeFilter() === 'Approved'"
        (click)="setFilter('Approved')"
      >
        Approved
      </button>
    </div>

    <div class="toolbar-actions">
      <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true"></p-button>
      <p-button label="Generate Registration Link" icon="pi pi-link" severity="secondary" [outlined]="true"></p-button>
      <p-button label="Vendor" icon="pi pi-plus"></p-button>
    </div>
  </div>

  <p-table [value]="filteredVendors()" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Actions</th>
        <th>Name of Company</th>
        <th>City</th>
        <th>Contact Person</th>
        <th>Email ID</th>
        <th>Nature of Service</th>
        <th>Type of Organization</th>
        <th>Vendor Status</th>
        <th>Record Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <button class="row-action" title="View"><i class="pi pi-eye"></i></button>
        </td>
        <td><strong>{{ row.name }}</strong></td>
        <td>{{ row.city }}</td>
        <td>{{ row.contact }}</td>
        <td>{{ row.email }}</td>
        <td>{{ row.services }}</td>
        <td>{{ row.organization }}</td>
        <td>
          <p-tag
            [value]="row.vendorStatus"
            [severity]="statusSeverity(row.vendorStatus).severity"
            [styleClass]="statusSeverity(row.vendorStatus).styleClass || ''"
          ></p-tag>
        </td>
        <td>
          <p-tag
            [value]="row.status"
            [severity]="statusSeverity(row.status).severity"
            [styleClass]="statusSeverity(row.status).styleClass || ''"
          ></p-tag>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="9" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No vendors match this filter.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
