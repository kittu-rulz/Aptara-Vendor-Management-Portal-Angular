<div class="table-card">
  <div class="table-toolbar report-toolbar">
    <div class="toolbar-header-row">
      <span class="section-heading"><i [class]="icon"></i> {{ heading }}</span>
      <div class="toolbar-actions">
        <p-button label="Export Excel" icon="pi pi-file-excel" severity="secondary" [outlined]="true"></p-button>
        <p-button label="Search" icon="pi pi-search"></p-button>
      </div>
    </div>

    <div class="report-filter-bar">
      <div class="filter-item" *ngFor="let f of filters">
        <label>{{ f.label }}</label>
        <input *ngIf="f.type === 'date'" type="date" />
        <select *ngIf="f.type === 'select'">
          <option value="">Select {{ f.label }}</option>
          <option *ngFor="let opt of f.options">{{ opt }}</option>
        </select>
      </div>
    </div>
  </div>

  <p-table [value]="rows" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of columns">{{ col.label }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td *ngFor="let col of columns">
          <p-tag
            *ngIf="col.isStatus; else plainCell"
            [value]="row[col.key]"
            [severity]="statusSeverity(row[col.key]).severity"
            [styleClass]="statusSeverity(row[col.key]).styleClass || ''"
          ></p-tag>
          <ng-template #plainCell>{{ row[col.key] }}</ng-template>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.length" class="empty-state">
          <i class="pi pi-search"></i>
          <div>No records found.</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
